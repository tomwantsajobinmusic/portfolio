<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thomas — Music Industry Portfolio</title>
<meta name="description" content="Thomas is looking for a job in music. Media, marketing and talent management work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="preload" as="image" href="brand/thomas-brown-logo.png" media="(max-width: 720px)">
<script>
  // Phone-only launch sequence (the photo push in js/main.js). It's decided
  // here, before first paint, so the homepage never flashes underneath it.
  // Plays once per browser session; add ?splash=1 to the URL to replay it.
  (function () {
    try {
      var root = document.documentElement;
      var forced = /[?&]splash=1(&|$)/.test(location.search);
      var phone = window.matchMedia('(max-width: 720px)').matches;
      var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches ||
                 !!(navigator.connection && navigator.connection.saveData);
      var seen = false;
      try { seen = sessionStorage.getItem('splashSeen') === '1'; } catch (e) {}
      if (!phone || calm || (seen && !forced)) return;
      root.classList.add('splash-on');
      try { sessionStorage.setItem('splashSeen', '1'); } catch (e) {}
      // If main.js never takes over (failed load, script error), don't leave the site hidden.
      setTimeout(function () { root.classList.remove('splash-on'); }, 10000);
    } catch (e) {}
  })();
</script>
</head>
<body>

<div class="splash" id="splash" aria-hidden="true">
  <div class="splash__reel" id="splashReel"></div>
  <img class="splash__logo" id="splashLogo" src="brand/thomas-brown-logo.png" alt="" width="475" height="125">
</div>

<main class="hero" id="hero">

  <!-- Background media layer: crossfading image/video cycler -->
  <div class="bg-media" id="bgMedia" aria-hidden="true">
    <div class="bg-layer bg-layer--a" id="bgLayerA"></div>
    <div class="bg-layer bg-layer--b" id="bgLayerB"></div>
    <div class="bg-overlay"></div>
  </div>

  <div class="hero-content">

    <div class="intro">
      <h1 class="intro__title">Hey, my name's Thomas</h1>
      <p class="tagline">
        <span class="tagline__prefix">and I'm looking for a job in</span>
        <span class="tagline__word" id="taglineWord" aria-live="polite">music</span>
      </p>
    </div>

    <nav class="scopes" aria-label="Areas of work">
      <ul class="scopes__list">
        <li class="scopes__item scopes__item--media">
          <a href="https://thomasbrown.media" target="_blank" rel="noopener noreferrer" data-category="media">Media</a>
        </li>
        <li class="scopes__item scopes__item--marketing">
          <a href="marketing.html" data-category="marketing">Marketing</a>
        </li>
        <li class="scopes__item scopes__item--talent">
          <a href="talent-management.html" data-category="talent-management">Talent Management</a>
        </li>
        <li class="scopes__item scopes__item--about">
          <a href="about-contact.html" data-category="about-contact">About/Contact</a>
        </li>
      </ul>
    </nav>

  </div>
</main>

<script src="js/main.js" defer></script>
</body>
</html>
